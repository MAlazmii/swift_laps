name: Validate iOS projects
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/validate_resources.py
  logic:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/test_logic.py
  build:
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        example: [diceRoll, timetables, tableDetail, favoritePlaces, researchPapers]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build for iOS Simulator
        run: >-
          xcodebuild build
          -project "examples/${{ matrix.example }}/${{ matrix.example }}.xcodeproj"
          -scheme "${{ matrix.example }}"
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
