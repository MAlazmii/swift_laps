name: Validate iOS projects
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_resources.py
  logic:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_logic.py
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        example: [diceRoll, timetables, tableDetail, favoritePlaces, researchPapers]
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >-
          xcodebuild build
          -project "examples/${{ matrix.example }}/${{ matrix.example }}.xcodeproj"
          -scheme "${{ matrix.example }}"
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
